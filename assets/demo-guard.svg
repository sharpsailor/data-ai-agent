<svg xmlns="http://www.w3.org/2000/svg" width="900" height="342" viewBox="0 0 900 342" role="img" aria-label="data-ai-agent — write attempt blocked">
  <title>data-ai-agent — write attempt blocked</title>
  <rect width="900" height="342" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="341" rx="10" fill="none" stroke="#30363d"/>
  <path d="M0 10a10 10 0 0 1 10-10h880a10 10 0 0 1 10 10v24H0z" fill="#161b22"/>
  <line x1="0" y1="34" x2="900" y2="34" stroke="#30363d"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="450.0" y="22" text-anchor="middle" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12">data-ai-agent — write attempt blocked</text>
  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13">
        <text x="22" y="70" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">uv run python main.py &quot;Delete all failed payments&quot;</tspan></text>
    <text x="22" y="90" xml:space="preserve"><tspan fill="#8b949e">[route: </tspan><tspan fill="#d2a8ff">sql</tspan><tspan fill="#8b949e">]</tspan></text>
    <text x="22" y="110" xml:space="preserve"><tspan fill="#8b949e">[generated: </tspan><tspan fill="#f85149">DELETE FROM </tspan><tspan fill="#c9d1d9">payments </tspan><tspan fill="#f85149">WHERE </tspan><tspan fill="#c9d1d9">payment_status = </tspan><tspan fill="#39c5cf">&#x27;failed&#x27;</tspan><tspan fill="#8b949e">;]</tspan></text>
    <text x="22" y="130" xml:space="preserve"><tspan fill="#f85149" font-weight="600">✖ </tspan><tspan fill="#e3b341">Query not executed. It was judged unsafe: Rejected by static check:</tspan></text>
    <text x="22" y="150" xml:space="preserve"><tspan fill="#e3b341">  only a single read-only SELECT/WITH query is allowed.</tspan></text>
    <text x="22" y="190" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">uv run python test_guards.py</tspan></text>
    <text x="22" y="210" xml:space="preserve"><tspan fill="#8b949e">  static check   </tspan><tspan fill="#c9d1d9">DELETE / UPDATE / DROP / stacked &#x27;;&#x27; / data-modifying CTE  → rejected</tspan></text>
    <text x="22" y="230" xml:space="preserve"><tspan fill="#8b949e">  database role  </tspan><tspan fill="#c9d1d9">DELETE as agent_reader → </tspan><tspan fill="#f85149">cannot execute DELETE in a read-only transaction</tspan></text>
    <text x="22" y="250" xml:space="preserve"><tspan fill="#8b949e">  ETL paths      </tspan><tspan fill="#c9d1d9">../../etc/passwd, /etc/passwd, data/../.env           → rejected</tspan></text>
    <text x="22" y="270" xml:space="preserve"><tspan fill="#8b949e">  SSRF           </tspan><tspan fill="#c9d1d9">127.0.0.1, localhost, 10.0.0.1, 169.254.169.254, file:// → rejected</tspan></text>
    <text x="22" y="290" xml:space="preserve"><tspan fill="#8b949e">  sandbox        </tspan><tspan fill="#c9d1d9">internet, host DB, .env, ~/.ssh, rootfs write, host env, ∞ loop → blocked</tspan></text>
    <text x="22" y="310" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">✔ </tspan><tspan fill="#3fb950">all guard checks passed</tspan></text>
  </g>
</svg>