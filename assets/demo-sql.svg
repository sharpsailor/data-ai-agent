<svg xmlns="http://www.w3.org/2000/svg" width="900" height="422" viewBox="0 0 900 422" role="img" aria-label="data-ai-agent — SQL analyst">
  <title>data-ai-agent — SQL analyst</title>
  <rect width="900" height="422" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="421" rx="10" fill="none" stroke="#30363d"/>
  <path d="M0 10a10 10 0 0 1 10-10h880a10 10 0 0 1 10 10v24H0z" fill="#161b22"/>
  <line x1="0" y1="34" x2="900" y2="34" stroke="#30363d"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="450.0" y="22" text-anchor="middle" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12">data-ai-agent — SQL analyst</text>
  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13">
        <text x="22" y="70" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">uv run python main.py &quot;Who are the top 3 drivers by average rating?&quot;</tspan></text>
    <text x="22" y="90" xml:space="preserve"><tspan fill="#8b949e">[route: </tspan><tspan fill="#d2a8ff">sql</tspan><tspan fill="#8b949e">]</tspan></text>
    <text x="22" y="110" xml:space="preserve"><tspan fill="#58a6ff">WITH </tspan><tspan fill="#c9d1d9">avg_ratings </tspan><tspan fill="#58a6ff">AS</tspan><tspan fill="#c9d1d9"> (</tspan></text>
    <text x="22" y="130" xml:space="preserve"><tspan fill="#58a6ff">  SELECT </tspan><tspan fill="#ffa657">AVG</tspan><tspan fill="#c9d1d9">(ratings.rating) </tspan><tspan fill="#58a6ff">AS </tspan><tspan fill="#c9d1d9">avg_rating, u.full_name</tspan></text>
    <text x="22" y="150" xml:space="preserve"><tspan fill="#58a6ff">  FROM </tspan><tspan fill="#c9d1d9">rides r </tspan><tspan fill="#58a6ff">JOIN </tspan><tspan fill="#c9d1d9">users u </tspan><tspan fill="#58a6ff">ON </tspan><tspan fill="#c9d1d9">r.driver_id = u.user_id</tspan></text>
    <text x="22" y="170" xml:space="preserve"><tspan fill="#58a6ff">  JOIN </tspan><tspan fill="#c9d1d9">ratings </tspan><tspan fill="#58a6ff">ON </tspan><tspan fill="#c9d1d9">r.ride_id = ratings.ride_id</tspan></text>
    <text x="22" y="190" xml:space="preserve"><tspan fill="#58a6ff">  GROUP BY </tspan><tspan fill="#c9d1d9">u.full_name</tspan></text>
    <text x="22" y="210" xml:space="preserve"><tspan fill="#c9d1d9">)</tspan></text>
    <text x="22" y="230" xml:space="preserve"><tspan fill="#58a6ff">SELECT </tspan><tspan fill="#c9d1d9">full_name, avg_rating </tspan><tspan fill="#58a6ff">FROM </tspan><tspan fill="#c9d1d9">avg_ratings </tspan><tspan fill="#58a6ff">ORDER BY </tspan><tspan fill="#c9d1d9">avg_rating </tspan><tspan fill="#58a6ff">DESC LIMIT </tspan><tspan fill="#ffa657">3</tspan><tspan fill="#c9d1d9">;</tspan></text>
    <text x="22" y="250" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">✔ </tspan><tspan fill="#c9d1d9">Lucas Wilson with an average rating of 4.52, Liam Smith with 4.43,</tspan></text>
    <text x="22" y="270" xml:space="preserve"><tspan fill="#c9d1d9">  and Priya Chen with 4.35 are the top drivers.</tspan></text>
    <text x="22" y="310" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">uv run python main.py &quot;How many rides in each city? Busiest first&quot;</tspan></text>
    <text x="22" y="330" xml:space="preserve"><tspan fill="#8b949e">[route: </tspan><tspan fill="#d2a8ff">sql</tspan><tspan fill="#8b949e">]</tspan></text>
    <text x="22" y="350" xml:space="preserve"><tspan fill="#58a6ff">SELECT </tspan><tspan fill="#c9d1d9">u.city, </tspan><tspan fill="#ffa657">COUNT</tspan><tspan fill="#c9d1d9">(r.ride_id) </tspan><tspan fill="#58a6ff">AS </tspan><tspan fill="#c9d1d9">ride_count </tspan><tspan fill="#58a6ff">FROM </tspan><tspan fill="#c9d1d9">rides r </tspan><tspan fill="#58a6ff">JOIN </tspan><tspan fill="#c9d1d9">users u ...</tspan></text>
    <text x="22" y="370" xml:space="preserve"><tspan fill="#58a6ff">GROUP BY </tspan><tspan fill="#c9d1d9">u.city </tspan><tspan fill="#58a6ff">ORDER BY </tspan><tspan fill="#c9d1d9">ride_count </tspan><tspan fill="#58a6ff">DESC</tspan><tspan fill="#c9d1d9">;</tspan></text>
    <text x="22" y="390" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">✔ </tspan><tspan fill="#c9d1d9">Vancouver 276, Montreal 262, Edmonton 257, Ottawa 249, Calgary 233, Toronto 223.</tspan></text>
  </g>
</svg>